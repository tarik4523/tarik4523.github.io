name: Update Google Scholar Citations

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch:        # also allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push citations.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch citations
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update_citations.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add citations.json
          git diff --cached --quiet || git commit -m "chore: update Scholar citations [skip ci]"
          git push
